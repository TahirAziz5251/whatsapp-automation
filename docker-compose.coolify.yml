        ON CONFLICT (id) DO UPDATE SET price_monthly_pkr = EXCLUDED.price_monthly_pkr;

        CREATE TABLE IF NOT EXISTS tenant_subscriptions (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            tenant_id UUID NOT NULL REFERENCES platform_tenants(id) ON DELETE CASCADE,
            plan_id VARCHAR(50) NOT NULL REFERENCES subscription_plans(id),
            status VARCHAR(20) NOT NULL DEFAULT 'ACTIVE' CHECK (status IN ('ACTIVE', 'TRIAL', 'PAST_DUE', 'CANCELLED')),
            current_period_start TIMESTAMPTZ NOT NULL DEFAULT NOW(),
            current_period_end TIMESTAMPTZ NOT NULL DEFAULT (NOW() + INTERVAL '30 days'),
            cancel_at_period_end BOOLEAN DEFAULT FALSE,
            created_at TIMESTAMPTZ DEFAULT NOW(),
            updated_at TIMESTAMPTZ DEFAULT NOW(),
            CONSTRAINT uq_tenant_subscription UNIQUE (tenant_id)
        );

        INSERT INTO tenant_subscriptions (tenant_id, plan_id, status)
        VALUES
        ('11111111-1111-1111-1111-111111111111', 'PROFESSIONAL', 'ACTIVE')
        ON CONFLICT (tenant_id) DO NOTHING;

        CREATE TABLE IF NOT EXISTS tenant_usage_records (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            tenant_id UUID NOT NULL REFERENCES platform_tenants(id) ON DELETE CASCADE,
            metric_type VARCHAR(50) NOT NULL,
            quantity INT NOT NULL DEFAULT 1,
            period_date DATE NOT NULL DEFAULT CURRENT_DATE,
            details JSONB DEFAULT '{}'::jsonb,
            created_at TIMESTAMPTZ DEFAULT NOW()
        );

        CREATE TABLE IF NOT EXISTS tenant_invoices (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            tenant_id UUID NOT NULL REFERENCES platform_tenants(id) ON DELETE CASCADE,
            invoice_number VARCHAR(50) UNIQUE NOT NULL,
            billing_period_start DATE NOT NULL,
            billing_period_end DATE NOT NULL,
            base_amount_pkr NUMERIC(10, 2) NOT NULL DEFAULT 0.00,
            overage_amount_pkr NUMERIC(10, 2) NOT NULL DEFAULT 0.00,
            total_amount_pkr NUMERIC(10, 2) NOT NULL DEFAULT 0.00,
            status VARCHAR(20) NOT NULL DEFAULT 'UNPAID',
            paid_at TIMESTAMPTZ,
            details JSONB DEFAULT '{}'::jsonb,
            created_at TIMESTAMPTZ DEFAULT NOW(),
            updated_at TIMESTAMPTZ DEFAULT NOW()
        );

        -- Row-Level Security (RLS) Enforcement across all tenant-scoped tables
        DO $$
        DECLARE
            tbl TEXT;
            rls_tables TEXT[] := ARRAY[
                'platform_contacts',
                'tenant_conversations',
                'tenant_messages',
                'tenant_outbox_messages',
                'clinic_doctors',
                'clinic_doctor_schedules',
                'clinic_appointments',
                'clinic_live_queues'
            ];
        BEGIN
            FOREACH tbl IN ARRAY rls_tables LOOP
                EXECUTE format('ALTER TABLE %I ENABLE ROW LEVEL SECURITY', tbl);
                EXECUTE format('ALTER TABLE %I FORCE ROW LEVEL SECURITY', tbl);
                EXECUTE format('DROP POLICY IF EXISTS tenant_isolation_%I ON %I', tbl, tbl);
                EXECUTE format(
                    'CREATE POLICY tenant_isolation_%I ON %I FOR ALL USING (tenant_id = (NULLIF(current_setting(''app.current_tenant_id'', true), ''''))::uuid) WITH CHECK (tenant_id = (NULLIF(current_setting(''app.current_tenant_id'', true), ''''))::uuid)',
                    tbl, tbl
                );
            END LOOP;
        END $$;

        -- Privileges for runtime user
        GRANT USAGE ON SCHEMA public TO bizflow_runtime;
        GRANT ALL ON ALL TABLES IN SCHEMA public TO bizflow_runtime;
        GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO bizflow_runtime;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO bizflow_runtime;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO bizflow_runtime;
        SQL

        # 4. Also run database directory files if mounted
        if [ -f /database/phase1_core_saas_schema.sql ]; then
          psql -X -d platform_db -f /database/phase1_core_saas_schema.sql || true
        fi
        if [ -f /database/phase4_clinic_schema.sql ]; then
          psql -X -d platform_db -f /database/phase4_clinic_schema.sql || true
        fi
        if [ -f /database/phase6_billing_and_metering.sql ]; then
          psql -X -d platform_db -f /database/phase6_billing_and_metering.sql || true
        fi
        if [ -f /database/seed_3_clinic_tenants.sql ]; then
          psql -X -d platform_db -f /database/seed_3_clinic_tenants.sql || true
        fi

        # 5. Final verification of runtime permissions
        psql -X -d platform_db <<'SQL'
        GRANT ALL ON ALL TABLES IN SCHEMA public TO bizflow_runtime;
        GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO bizflow_runtime;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO bizflow_runtime;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO bizflow_runtime;
        SQL
    networks:
      - bizflow-network

  # ----------------------------------------------------------------------------
  # 3. REDIS (Caching, Mutex Send Locks & Deduplication)
  # ----------------------------------------------------------------------------
  wa-redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: wa-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-bizflow_redis_secret_2026}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "6379:6379"
    volumes:
      - wa_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - bizflow-network

  # ----------------------------------------------------------------------------
  # 4. EVOLUTION GO WHATSAPP GATEWAY (Port 4000)
  # ----------------------------------------------------------------------------
  evolution-go:
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-go:latest}
    container_name: evolution-go
    restart: unless-stopped
    depends_on:
      wa-db-init:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    environment:
      SERVER_PORT: "4000"
      CLIENT_NAME: "bizflow-production"
      GLOBAL_API_KEY: ${EVOLUTION_API_KEY:-63558bce778d55e61b438b9bd5a0f72326bbac65d52caf0c6ded8b6a8b081b65}
      POSTGRES_AUTH_DB: "postgresql://evolution_app:${EVOLUTION_DB_PASSWORD:-bizflow_evo_db_pass_2026}@wa-postgres:5432/evogo_auth?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://evolution_app:${EVOLUTION_DB_PASSWORD:-bizflow_evo_db_pass_2026}@wa-postgres:5432/evogo_users?sslmode=disable"
      DATABASE_SAVE_MESSAGES: "false"
      CONNECT_ON_STARTUP: ${EVOLUTION_CONNECT_ON_STARTUP:-true}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://backend:8000/api/v1/channels/whatsapp/evolution}
      WEBHOOK_FILES: "true"
      EVENT_IGNORE_GROUP: "false"
      EVENT_IGNORE_STATUS: "true"
      QRCODE_MAX_COUNT: "5"
      WADEBUG: INFO
      LOGTYPE: console
      LOG_DIRECTORY: /app/logs
      OS_NAME: Linux
      TZ: Asia/Karachi
    volumes:
      - wa_evolution_data:/app/dbdata
      - wa_evolution_logs:/app/logs
    healthcheck:
      test: [CMD, wget, -q, -T, "4", -O, /dev/null, "http://127.0.0.1:4000/server/ok"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - bizflow-network

  # ----------------------------------------------------------------------------
  # 5. FASTAPI BACKEND CORE & AI SUPERVISOR (Port 8000)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bizflow-backend
    restart: unless-stopped
    depends_on:
      wa-db-init:
        condition: service_completed_successfully
      wa-redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    environment:
      POSTGRES_SERVER: wa-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: bizflow_runtime
      POSTGRES_PASSWORD: ${RUNTIME_PASSWORD:-bizflow_secure_runtime_2026}
      POSTGRES_DB: platform_db
      SECRET_KEY: ${SECRET_KEY:-bizflow_dev_secret_key_change_in_production_2026}
      GROQ_API_KEY: ${GROQ_API_KEY:-gsk_placeholder_key}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      REDIS_URL: redis://:${REDIS_PASSWORD:-bizflow_redis_secret_2026}@wa-redis:6379/0
      EVOLUTION_API_URL: http://evolution-go:4000
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-63558bce778d55e61b438b9bd5a0f72326bbac65d52caf0c6ded8b6a8b081b65}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://192.168.1.31:3000}
      ENABLE_OUTBOX_DISPATCHER: ${ENABLE_OUTBOX_DISPATCHER:-true}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - bizflow-network

  # ----------------------------------------------------------------------------
  # 6. NEXT.JS 14 WEB DASHBOARDS (Port 3000)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bizflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://192.168.1.31:8001/api/v1}
      NEXT_PUBLIC_TENANT_ID: ${DEFAULT_TENANT_ID:-11111111-1111-1111-1111-111111111111}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - bizflow-network

# ------------------------------------------------------------------------------
# VOLUMES (Preserving 100% of your existing Coolify persistent data)
# ------------------------------------------------------------------------------
volumes:
  wa_postgres_data:
    name: wa_postgres_data
  wa_evolution_data:
    name: wa_evolution_data
  wa_evolution_logs:
    name: wa_evolution_logs
  wa_redis_data:
    name: wa_redis_data

# ------------------------------------------------------------------------------
# NETWORKS
# ------------------------------------------------------------------------------
networks:
  bizflow-network:
    name: bizflow-network
    driver: bridge
