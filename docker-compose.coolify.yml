        ON CONFLICT (tenant_id, id) DO UPDATE SET name = EXCLUDED.name, specialty = EXCLUDED.specialty, fee_pkr = EXCLUDED.fee_pkr, room_number = EXCLUDED.room_number;

        -- Seed Schedules
        INSERT INTO clinic_doctor_schedules (tenant_id, id, doctor_id, day_of_week, start_time, end_time, slot_duration_minutes, max_patients_per_session)
        VALUES
