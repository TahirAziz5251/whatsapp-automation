services:
  evolution-go:
    profiles: ["legacy-alternative"]
    image: evoapicloud/evolution-go:latest
    container_name: evolution-postgres-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      SERVER_PORT: 4000
      CLIENT_NAME: "evolution"
      GLOBAL_API_KEY: "429683C4C977415CAAFCCE10F7D57E11"
      POSTGRES_AUTH_DB: "postgresql://postgres:Tahir%404321@host.docker.internal:5432/evogo_auth?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://postgres:Tahir%404321@host.docker.internal:5432/evogo_users?sslmode=disable"
      DATABASE_SAVE_MESSAGES: "false"
      WADEBUG: "INFO"
      LOGTYPE: "console"
      CONNECT_ON_STARTUP: "true"
      WEBHOOK_FILES: "true"
      OS_NAME: "Linux"
      WEBHOOK_URL: "http://host.docker.internal:5678/webhook/evolution-whatsapp-agent"
      EVENT_IGNORE_GROUP: "false"
      EVENT_IGNORE_STATUS: "true"
      QRCODE_MAX_COUNT: "5"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - evolution_data:/app/dbdata
      - evolution_logs:/app/logs
    networks:
      - evolution_network

  postgres:
    profiles: ["legacy-postgres"]
    image: pgvector/pgvector:pg15
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-crm-db.sql:/docker-entrypoint-initdb.d/init-crm-db.sql
    networks:
      - evolution_network

  n8n:
    image: docker.n8n.io/n8nio/n8n@sha256:c628aa44f1cc3de51f81b3a2b31ca1fa95de20638379e257330e575388964faf
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678
      - N8N_ENCRYPTION_KEY=8Wd6Xt/WLqsb8lQkFZA0DLahbPfn6VbI
      - NODE_FUNCTION_ALLOW_EXTERNAL=pg,ioredis
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - evolution_network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 120s

  faiss-service:
    profiles: ["optional-kb"]
    build:
      context: ./faiss-service
      dockerfile: Dockerfile
    container_name: faiss-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - faiss_data:/app/data
      - ./knowledge_base.json:/app/knowledge_base.json
    networks:
      - evolution_network

  redis:
    image: redis@sha256:ba6e394f6acc2a695ef1b6944f161b9ca813711739be68319fa0db3470673f1d
    container_name: evolution-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - evolution_network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  evolution_data:
    driver: local
  evolution_logs:
    driver: local
  postgres_data:
    external: true
    name: examples_postgres_data
  faiss_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    external: true
    name: n8n_data

networks:
  evolution_network:
    driver: bridge
