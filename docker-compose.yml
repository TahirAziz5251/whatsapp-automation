version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. POSTGRESQL 18 + PGVECTOR (Multi-Tenant Database with RLS)
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bizflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Tahir@4321}
      POSTGRES_DB: platform_db
      TZ: Asia/Karachi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/phase1_core_saas_schema.sql:/docker-entrypoint-initdb.d/01_phase1.sql:ro
      - ./database/phase4_clinic_schema.sql:/docker-entrypoint-initdb.d/02_phase4.sql:ro
      - ./database/phase6_billing_and_metering.sql:/docker-entrypoint-initdb.d/03_phase6.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bizflow-network

  # ----------------------------------------------------------------------------
  # 2. REDIS (Caching, Session Locks & Rate Limiting)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bizflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bizflow-network

  # ----------------------------------------------------------------------------
  # 3. FASTAPI BACKEND CORE & AI SUPERVISOR ENGINE
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bizflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: bizflow_runtime
      POSTGRES_PASSWORD: ${RUNTIME_PASSWORD:-bizflow_secure_runtime_2026}
      POSTGRES_DB: platform_db
      SECRET_KEY: ${SECRET_KEY:-bizflow_dev_secret_key_change_in_production_2026}
      GROQ_API_KEY: ${GROQ_API_KEY:-gsk_test_mock_key}
      GROQ_MODEL: llama-3.3-70b-versatile
      REDIS_URL: redis://redis:6379/0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bizflow-network

  # ----------------------------------------------------------------------------
  # 4. BACKGROUND REMINDER & USAGE METERING WORKER
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bizflow-worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "-m", "app.workers.reminder_worker"]
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: bizflow_runtime
      POSTGRES_PASSWORD: ${RUNTIME_PASSWORD:-bizflow_secure_runtime_2026}
      POSTGRES_DB: platform_db
    networks:
      - bizflow-network

  # ----------------------------------------------------------------------------
  # 5. NEXT.JS 14 WEB DASHBOARDS (Reception, Doctor, Patient)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bizflow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_TENANT_ID: "11111111-1111-1111-1111-111111111111"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - bizflow-network

  # ----------------------------------------------------------------------------
  # 6. EVOLUTION GO WHATSAPP GATEWAY (Whatsmeow Client)
  # ----------------------------------------------------------------------------
  evolution-go:
    image: evoapicloud/evolution-go:latest
    container_name: bizflow-evolution-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      SERVER_PORT: 4000
      CLIENT_NAME: "bizflow-evolution"
      GLOBAL_API_KEY: ${EVOLUTION_API_KEY:-63558bce778d55e61b438b9bd5a0f72326bbac65d52caf0c6ded8b6a8b081b65}
      POSTGRES_AUTH_DB: "postgresql://postgres:${POSTGRES_PASSWORD:-Tahir%404321}@postgres:5432/platform_db?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://postgres:${POSTGRES_PASSWORD:-Tahir%404321}@postgres:5432/platform_db?sslmode=disable"
      DATABASE_SAVE_MESSAGES: "false"
      WADEBUG: "INFO"
      LOGTYPE: "console"
      CONNECT_ON_STARTUP: "true"
      WEBHOOK_FILES: "true"
      WEBHOOK_URL: "http://backend:8000/api/v1/channels/evolution/webhook"
      EVENT_IGNORE_GROUP: "false"
      EVENT_IGNORE_STATUS: "true"
      QRCODE_MAX_COUNT: "5"
    volumes:
      - evolution_data:/app/dbdata
      - evolution_logs:/app/logs
    networks:
      - bizflow-network

networks:
  bizflow-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  evolution_data:
  evolution_logs:
