version: '3.8'

services:
  evolution-go:
    image: evoapicloud/evolution-go:latest
    container_name: evolution-go
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      # Servidor
      SERVER_PORT: 4000
      CLIENT_NAME: "evolution"

      # Segurança (OBRIGATÓRIO)
      GLOBAL_API_KEY: "429683C4C977415CAAFCCE10F7D57E11"

      # Banco de Dados PostgreSQL (Windows Host PostgreSQL 18 - Option A Unified)
      POSTGRES_AUTH_DB: "postgresql://postgres:Tahir%404321@host.docker.internal:5432/evogo_auth?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://postgres:Tahir%404321@host.docker.internal:5432/evogo_users?sslmode=disable"
      DATABASE_SAVE_MESSAGES: "false"

      # Logs e Debug
      WADEBUG: "INFO"
      LOGTYPE: "console"
      LOG_DIRECTORY: "/app/logs"
      LOG_MAX_SIZE: "100"
      LOG_MAX_BACKUPS: "5"
      LOG_MAX_AGE: "30"
      LOG_COMPRESS: "true"

      # Conexão
      CONNECT_ON_STARTUP: "true"

      WEBHOOK_FILES: "true"

      # Sistema
      OS_NAME: "Linux"

      # Eventos (Opcionais)
      WEBHOOK_URL: "http://host.docker.internal:5678/webhook/evolution-whatsapp-agent"

      AMQP_URL: ""
      AMQP_GLOBAL_ENABLED: "false"
      NATS_URL: ""
      NATS_GLOBAL_ENABLED: "false"

      # Armazenamento de Mídia (Opcional)
      MINIO_ENABLED: "false"

      # Proxy (Opcional)
      PROXY_HOST: ""
      PROXY_PORT: ""
      PROXY_USERNAME: ""
      PROXY_PASSWORD: ""

      # Eventos
      EVENT_IGNORE_GROUP: "false"
      EVENT_IGNORE_STATUS: "true"

      # QR Code
      QRCODE_MAX_COUNT: "5"

    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - evolution_data:/app/dbdata
      - evolution_logs:/app/logs
    networks:
      - evolution_network

  postgres:
    image: pgvector/pgvector:pg15
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - evolution_network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_ENCRYPTION_KEY=8Wd6Xt/WLqsb8lQkFZA0DLahbPfn6VbI
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - evolution_network
    depends_on:
      - postgres

volumes:
  evolution_data:
    driver: local
  evolution_logs:
    driver: local
  postgres_data:
    driver: local
  n8n_data:
    external: true
    name: n8n_data

networks:
  evolution_network:
    driver: bridge
 